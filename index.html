<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 해시태그 URL 단축기 (이동 버튼 추가)</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f7fa; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        h2 { margin: 0 0 10px 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #4f46e5; }
        button { width: 100%; padding: 14px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .result { margin-top: 20px; padding: 15px; background: #eef2ff; border-radius: 8px; display: none; text-align: left; }
        .short-url { font-weight: bold; color: #4f46e5; font-size: 16px; word-break: break-all; margin: 8px 0; display: block; text-align: center; }
        
        /* 버튼 정렬용 스타일 */
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-group button, .btn-group a { flex: 1; text-align: center; text-decoration: none; display: inline-block; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-copy { background: #10b981; color: white; }
        .btn-copy:hover { background: #059669; }
        .btn-go { background: #3b82f6; color: white; }
        .btn-go:hover { background: #2563eb; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- [메인 UI] 주소를 단축하고 생성하는 화면 -->
<div class="card" id="main-ui">
    <h2>🔗 URL 단축기</h2>
    <p>원하는 3자리 키워드로 링크를 줄여보세요.</p>
    <input type="url" id="longUrl" placeholder="https://... (이동할 긴 주소)" required>
    <input type="text" id="customKey" placeholder="abc (원하는 3자리 글자)" maxlength="3" minlength="3" required>
    <button onclick="makeShortLink()">단축 링크 생성</button>

    <div class="result" id="resultBox">
        <span style="font-size:13px; color:#4338ca; font-weight:bold;">생성된 단축 주소:</span>
        <span class="short-url" id="shortUrlText"></span>
        
        <!-- 하단 버튼 레이아웃 변경 -->
        <div class="btn-group">
            <button onclick="copyLink()" class="btn-copy">주소 복사</button>
            <a id="goToLink" href="#" target="_blank" class="btn-go">링크 이동</a>
        </div>
    </div>
</div>

<!-- [이동 UI] 단축 주소 클릭 시 나타나는 리다이렉트 화면 -->
<div class="card" id="redirect-ui" style="display:none;">
    <div class="loader"></div>
    <h2>안전하게 이동 중입니다</h2>
    <p>잠시만 기다려주세요...</p>
</div>

<script>
// 1. 단축 링크 데이터베이스 목록
const linkDatabase = {
    "abc": "https://naver.com",
    "123": "https://google.com",
    "xyz": "https://youtube.com"
};

// 2. 주소창의 #hash 값을 감지하여 리다이렉트하는 핵심 로직
function checkRedirect() {
    const hashKey = window.location.hash.substring(1); 
    
    if (hashKey && linkDatabase[hashKey]) {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('redirect-ui').style.display = 'block';
        window.location.replace(linkDatabase[hashKey]);
    }
}

window.onload = checkRedirect;

// 3. 메인 화면에서 단축 주소 생성 버튼을 눌렀을 때 작동하는 함수
function makeShortLink() {
    const longUrl = document.getElementById('longUrl').value;
    const customKey = document.getElementById('customKey').value.trim();

    if (!longUrl || customKey.length !== 3) {
        alert("긴 주소를 넣고, 단축 키를 3자리로 정확히 입력해주세요!");
        return;
    }

    // 중복 검사 로직
    if (linkDatabase[customKey] !== undefined) {
        alert(`❌ '${customKey}'는 이미 사용 중인 단축 키입니다!\n다른 3자리 글자를 입력해 주세요.`);
        document.getElementById('customKey').focus();
        document.getElementById('resultBox').style.display = 'none';
        return;
    }

    // 현재 사이트 메인 주소 뒤에 #3자리 주소를 붙여서 완성합니다.
    const baseUrl = window.location.href.split('#')[0];
    const generatedUrl = `${baseUrl}#${customKey}`;

    // 화면 주소 표시 업데이트
    document.getElementById('shortUrlText').innerText = generatedUrl;
    
    // 💡 [추가 기능] 이동 버튼의 href 속성에 생성된 주소를 강제로 심어줍니다.
    document.getElementById('goToLink').href = generatedUrl;
    
    document.getElementById('resultBox').style.display = 'block';
}

// 4. 복사 기능
function copyLink() {
    const text = document.getElementById('shortUrlText').innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("단축 링크가 복사되었습니다!");
    });
}
</script>

</body>
</html>
