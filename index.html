<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초간단 URL 단축기</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #1a73e8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        .result { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 6px; display: none; word-break: break-all; }
        .short-url { font-weight: bold; color: #1a73e8; font-size: 18px; margin: 10px 0; display: block; }
    </style>
</head>
<body>

<div class="card" id="main-ui">
    <h2>🔗 URL 단축 생성기</h2>
    <p style="color:#666; font-size:14px;">긴 주소를 넣고 원하는 3자리 글자를 입력하세요.</p>
    <input type="url" id="longUrl" placeholder="https://... (긴 주소 입력)" required>
    <input type="text" id="customKey" placeholder="abc (원하는 3자리 글자)" maxlength="3" minlength="3" required>
    <button onclick="makeShortLink()">단축 링크 만들기</button>

    <div class="result" id="resultBox">
        <p style="margin:0; color:#555;">생성된 단축 주소:</p>
        <span class="short-url" id="shortUrlText"></span>
        <button onclick="copyLink()" style="background:#34a853; padding:8px; font-size:14px;">주소 복사하기</button>
    </div>
</div>

<div class="card" id="redirect-ui" style="display:none;">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
    <h2>안전하게 이동 중입니다</h2>
    <p>잠시만 기다려주세요...</p>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
</div>

<script>
// 1. 내 단축 데이터를 저장할 가상의 공간 (여기에 원하는 대로 무한 추가 가능!)
// 형태: '3자리키': '진짜이동할주소'
const linkDatabase = {
    "abc": "https://naver.com",
    "123": "https://google.com",
    "xyz": "https://youtube.com"
};

// 2. 페이지가 켜질 때 단축 주소로 들어온 건지 확인하고 이동시키는 로직
const urlParams = new URLSearchParams(window.location.search);
const key = urlParams.get('to'); // 주소창의 ?to=abc 에서 abc를 추출

if (key && linkDatabase[key]) {
    // 만약 등록된 3자리 키가 주소창에 있다면 해당 사이트로 강제 이동!
    document.getElementById('main-ui').style.display = 'none';
    document.getElementById('redirect-ui').style.display = 'block';
    setTimeout(() => {
        window.location.replace(linkDatabase[key]);
    }, 500);
}

// 3. 메인 화면에서 사용자가 단축 버튼을 눌렀을 때 작동하는 함수
function makeShortLink() {
    const longUrl = document.getElementById('longUrl').value;
    const customKey = document.getElementById('customKey').value;

    if (!longUrl || customKey.length !== 3) {
        alert("긴 주소를 입력하고, 단축 키를 정확히 3자리로 입력해주세요!");
        return;
    }

    // 💡 안내: 깃허브 특성상 코드 내부 linkDatabase에 직접 주소를 매번 타이핑해 넣어두어야 실 작동합니다.
    // 여기서는 화면에 주소가 어떻게 생성되는지 규칙만 보여줍니다.
    const baseUrl = window.location.href.split('?')[0];
    const generatedUrl = `${baseUrl}?to=${customKey}`;

    document.getElementById('shortUrlText').innerText = generatedUrl;
    document.getElementById('resultBox').style.display = 'block';
}

// 4. 주소 복사 기능
function copyLink() {
    const text = document.getElementById('shortUrlText').innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("단축 링크가 복사되었습니다!");
    });
}
</script>

</body>
</html>
